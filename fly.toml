# Optional Fly.io deploy (needs `fly auth login` + `fly launch` once).
# Free allowance is limited; prefer Render free Web Service for a public demo.
app = "langgraph-interactive"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8765
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
